apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      hostNetwork: true
      containers:
        - name: worker
          image: example/worker:1.0
          securityContext:
            privileged: true
            runAsNonRoot: false
          env:
            - name: API_TOKEN
              value: hardcodedtoken
